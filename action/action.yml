name: GDPR PR Reviewer
description: >-
  Posts one review with inline comments on personal-data risks in a pull request.
  The diff is sent to the review service, and from there to OpenRouter and the upstream
  model provider. Automated check, not legal advice.
inputs:
  service-url:
    description: Base URL of the review service (POST /review is called on it).
    required: true
  service-token:
    description: Bearer token the service expects (GDPR_REVIEWER_TOKEN). Pass it from a secret.
    required: true
  github-token:
    description: Token used to read the diff and post the review. Needs pull-requests write.
    required: false
    default: ${{ github.token }}
  max-comments:
    description: Most inline comments per review; the rest are listed in the review body.
    required: false
    default: "10"
  fail-on-error:
    description: >-
      Fail the job when the review could not run (service or GitHub error, unreadable
      config). Findings never fail the job. Default false: errors are warnings.
    required: false
    default: "false"
  config-file:
    description: >-
      Repo config read at the PR head. Files matching its ignored_paths globs are removed
      from the diff before it is sent.
    required: false
    default: .gdpr-reviewer.yml
runs:
  using: composite
  steps:
    - name: Review the pull request
      shell: bash
      # Inputs reach the script only through env, never interpolated into this line.
      run: python3 "$GITHUB_ACTION_PATH/review_pr.py"
      env:
        INPUT_SERVICE_URL: ${{ inputs.service-url }}
        INPUT_SERVICE_TOKEN: ${{ inputs.service-token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MAX_COMMENTS: ${{ inputs.max-comments }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
